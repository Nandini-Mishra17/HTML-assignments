<!DOCTYPE html>
<html>
<head>
    <title>Assignment 18</title>
    <style>
        header {
            background-color: #162473;
            color: #ffffff;
        }
        th {
            background-color: #e6ebf5;
            color: #000000;
        }
        footer {
            background-color: #162473;
            color: #ffffff;
        }
    </style>
</head>
<body>

    <header>
        <br>
        <h1 align="center">ABC College Admission 2026</h1>
        <br>
    </header>

    <br>

    <table width="75%" align="center" border="0" cellpadding="10">
        <tr>
            <td>
                <h2>Courses and Fees</h2>

                <table width="100%" border="1" cellspacing="0" cellpadding="8">
                    <caption>Available Courses</caption>
                    <thead>
                        <tr>
                            <th>Course</th>
                            <th>Seats</th>
                            <th>Fees</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>B.Tech CSE</td>
                            <td>120</td>
                            <td>&#8377;90,000</td>
                        </tr>
                        <tr>
                            <td>BCA</td>
                            <td>60</td>
                            <td>&#8377;45,000</td>
                        </tr>
                    </tbody>
                </table>

                <br><br>

                <form action="#" method="post">
                    <fieldset>
                        <legend>Application Form</legend>

                        <label for="name">Name:</label><br>
                        <input type="text" id="name" name="name" size="40"><br><br>

                        <label for="email">Email:</label><br>
                        <input type="email" id="email" name="email" size="40"><br><br>

                        <label for="course">Course:</label><br>
                        <select id="course" name="course">
                            <option value="btech">B.Tech CSE</option>
                            <option value="bca">BCA</option>
                        </select><br><br>

                        <label for="statement">Statement:</label><br>
                        <textarea id="statement" name="statement" rows="5" cols="65"></textarea><br><br>

                        <input type="submit" value="Apply">
                    </fieldset>
                </form>
            </td>
        </tr>
    </table>

    <br>

    <footer>
        <p align="center"><br>&copy; 2026 ABC College<br><br></p>
    </footer>

</body>
</html>

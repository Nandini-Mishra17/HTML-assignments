<!DOCTYPE html>
<html lang="en">
<head>
  <title>Assignment 11</title>
  <style>
    body {
      font-family: "Times New Roman", Times, serif;
      margin: 20px;
    }
    .skip-link {
      display: block;
    }
    nav a {
      margin-right: 4px;
    }
    .banner-container {
      display: flex;
      align-items: center;
      margin-bottom: 20px;
    }
    .banner-img {
      width: 280px;
      height: 24px;
      border: 1px solid #ccc;
      margin-right: 6px;
    }
    .close-btn {
      padding: 4px 8px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- Skip link for screen readers and keyboard navigation -->
  <a href="#main-content" class="skip-link">Skip to main content</a>

  <!-- Navigation links -->
  <nav aria-label="Main navigation">
    <a href="#home">Home</a>
    <a href="#help">Help</a>
  </nav>

  <!-- Main content area -->
  <main id="main-content">
    <h1>Accessible Page</h1>

    <!-- Image placeholder (broken image icon) and Close button -->
    <div class="banner-container">
      <img src="missing-banner.png" alt="" class="banner-img">
      <button type="button" aria-label="Close" class="close-btn">X</button>
    </div>

    <!-- Accessible search form -->
    <form role="search">
      <label for="search-input">Search:</label>
      <input type="text" id="search-input" name="q">
    </form>
  </main>

</body>
</html>
